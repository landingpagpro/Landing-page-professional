  font-family:'Cairo', ui-sans-system, system-ui, -apple-system, Segoe UI, sans-serif;
  background:#f1f5f9;
  color:#111827;
  font-weight:700
}

h1,h2,h3{
  font-weight:900;
  letter-spacing:-.01em;
  text-shadow:0 1px 0 rgba(255,255,255,.35)
}

#landing{
  font-family:'Cairo', ui-sans-system, system-ui, sans-serif;
  font-weight:700
}

#landing h1,#landing h2,#landing h3,#landing h4{
  font-weight:900 !important;
  color:#000000;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

#landing p,#landing li,#landing span,#landing td,#landing th,#landing summary,#landing label,#landing input,#landing button,#landing a{
  font-weight:700
}

#landing p,#landing li{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important
}

#landing li{
  font-size:22px !important
}

#landing span,#landing td,#landing th,#landing summary{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important
}

.landing-title{
  font-size:var(--landing-title,46px) !important;
  line-height:1.35 !important;
  font-weight:900 !important;
  letter-spacing:.2px;
  text-shadow:0 3px 18px rgba(0,0,0,.22);
  width:100% !important;
  text-align:right !important;
  word-break:normal;
  color:#000000
}

.landing-h2{
  font-size:38px !important;
  line-height:1.4 !important;
  font-weight:900 !important;
  letter-spacing:.2px;
  color:#000000 !important;
  width:100% !important;
  text-align:right !important;
  word-break:normal;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

.landing-p{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important;
  font-weight:700 !important;
  color:#000000 !important;
  letter-spacing:.2px;
  width:100% !important;
  text-align:justify !important;
  text-justify:inter-word;
  word-break:normal;
  padding:0 !important;
  margin-top:12px !important;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

#landing label{
  font-size:20px !important;
  font-weight:800 !important
}

#landing .premium-card p,#landing .premium-card li{
  font-size:var(--landing-body,24px) !important
}

.template-dark #landing h1,.template-dark #landing h2,.template-dark #landing h3,.template-dark .landing-h2{
  color:#f59e0b !important
}

.template-dark #landing .landing-p,.template-dark #landing p,.template-dark #landing li{
  color:#ffffff !important;
  text-shadow:0 0 1px rgba(255,255,255,.15)
}

.template-dark #landing .landing-title{
  color:#ffffff !important
}

.template-clean #landing .landing-title{
  color:#000000 !important
}

.landing-price{
  font-size:44px !important;
  line-height:1.1 !important;
  font-weight:900 !important
}

.offer-price{
  font-size:48px !important;
  line-height:1.1 !important;
  font-weight:900 !important;
  color:#16a34a
}

.example-hero{
  position:relative;
  overflow:hidden
}

.example-hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;
  height:46px;
  background:var(--wave-fill,#f5f3ff);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  pointer-events:none
}

.example-model{
  border-radius:24px 24px 110px 110px;
  overflow:hidden
}

.example-product{
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 24px 50px rgba(0,0,0,.28)
}

.landing-btn{
  font-size:20px !important;
  font-weight:900 !important;
  padding:18px 44px !important;
  border-radius:999px !important
}

#landing button,#landing a{
  font-size:20px !important;
  font-weight:900 !important
}

#landing .offer-price{
  font-size:48px !important
}

.template-dark .landing-p{
  color:#f9fafb !important
}

.template-dark .landing-h2{
  color:#f59e0b !important
}

.template-clean .landing-p{
  color:#1f2937 !important
}

.template-dark .premium-card{
  background:#1f2937 !important;
  border:2px solid #f59e0b !important;
  color:#f9fafb !important
}

.template-clean .premium-card:nth-child(even){
  background:#f9fafb !important
}

.template-clean .landing-title{
  font-family:Georgia,serif !important
}

#landing,#landing *{
  min-height:0
}

#landing .premium-card{
  background:#ffffff !important
}

.template-dark #landing .premium-card{
  background:#1f2937 !important
}

.premium-card{
  border-radius:20px !important;
  border:1px solid rgba(0,0,0,.05) !important;
  box-shadow:0 10px 28px rgba(0,0,0,.10) !important;
  transition:transform .25s ease, box-shadow .25s ease;
  width:100% !important
}

.premium-card:hover{
  transform:translateY(-3px);
  box-shadow:0 28px 70px rgba(0,0,0,.16) !important
}

#landing img{
  width:100% !important;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

#landing .landing-p,#landing p{
  max-width:none !important
}

input,textarea,select{
  font-family:'Cairo', sans-serif
}

html{
  direction:rtl
}

input,textarea,select{
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:#6366f1 !important;
  box-shadow:0 0 0 3px rgba(99,102,241,.15)
}

.rich-editor:empty:before{
  content:attr(data-placeholder);
  color:#94a3b8;
  font-weight:700
}

.rich-editor [data-pill]{
  display:inline-flex !important;
  align-items:center;
  gap:6px;
  vertical-align:middle
}

.rich-editor{
  white-space:pre-wrap;
  word-break:break-word
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-1deg)
  }

  50%{
    transform:translateY(-12px) rotate(1deg)
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.floaty{
  animation:floaty 5s ease-in-out infinite
}

.pop{
  animation:pop .25s ease
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:99px
}

#landing h1{
  font-size:42px !important;
  line-height:1.35 !important;
  font-weight:900 !important
}

#landing h2{
  font-size:32px !important;
  line-height:1.4 !important;
  font-weight:900 !important
}

#landing p{
  font-size:22px !important;
  line-height:2 !important
}

#landing{
  width:100%;
  margin-left:auto;
  margin-right:auto
}

#landing[data-device="mobile"]{
  max-width:375px !important
}

#landing[data-device="desktop"]{
  max-width:880px !important
}

#landing .price,#landing .landing-price{
  font-size:44px !important
}

#landing a,#landing button{
  font-size:18px !important
}

<script>
(function(){
  // تخبية Safe - Time Unit Only, without setInterval اللي كيخنق Page ويخليها بيضاء
  function doHide(){
    // 1) Card Google Lens - Hide Card Only
    document.querySelectorAll("h3").forEach(function(el){
      if((el.textContent||"").indexOf("Description like Google Lens")!==-1){
        var card = el.closest("div[class*='violet'], div[class*='rounded-2xl']");
        if(card) card.style.display = "none";
      }
    });
    // 2) Email And Instagram - shown now, do not hide
    // 3) Button Generation - نحيدو Not الزر
    document.querySelectorAll("button").forEach(function(b){
      var txt = (b.textContent||"").trim();
      if(txt.indexOf("Generate")!==-1 || txt.indexOf("Search About Product Same Image")!==-1){ b.style.display = "none"; }
    });
  }
  // نعاودو Time Unit After What Endures React, ماشي Every 2 Seconds
  setTimeout(doHide, 800);
  setTimeout(doHide, 2000);
  // Except Replaceات Page (React re-render), نعاودو Time Unit
  var obs = new MutationObserver(function(){ setTimeout(doHide, 300); });
  document.addEventListener("DOMContentLoaded", function(){
    var root = document.getElementById("root");
    if(root) obs.observe(root, {childList:true, subtree:true});
  });
})();

  // Button In Section Domain: How Create Domain
  function addDomainHelpButton(){
    if(document.getElementById("domain-help-btn")) return;
    var headers = document.querySelectorAll("h4");
    for(var i=0;i<headers.length;i++){
      if((headers[i].textContent||"").indexOf("Link with Custom Domain")!==-1){
        var card = headers[i].closest("div");
        // لقينا Card Domain - نزيدو Button Below Title
        var btn = document.createElement("button");
        btn.id = "domain-help-btn";
        btn.type = "button";
        btn.textContent = "❓ How to Create a Custom Domain? Click Here";
        btn.style.cssText = "width:100%;margin-top:8px;padding:10px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;";
        btn.onclick = function(){
          var modal = document.getElementById("domain-help-modal");
          if(modal){ modal.style.display = "flex"; return; }
          var m = document.createElement("div");
          m.id = "domain-help-modal";
          m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;";
          m.innerHTML = '<div style="background:#fff;color:#111;border-radius:16px;max-width:480px;width:100%;padding:20px;max-height:85vh;overflow:auto;text-align:right;direction:rtl;">'
            + '<h3 style="font-size:18px;font-weight:900;margin:0 0 12px;">🌐 How to Create a Custom Domain for Your Store?</h3>'
            + '<p style="font-size:14px;line-height:1.9;margin:0 0 8px;"><b>1. 1. Buy the Domain:</b> Go to <b>Hostinger</b> or <b>Namecheap</b> or <b>GoDaddy</b>, and search for your store name (Example: mystore.com), then buy it - it costs about 10 to 12 dollars per year.</p>'
            + '<p style="font-size:14px;line-height:1.9;margin:0 0 8px;"><b>2. 2. Upload the HTML File:</b> Go to <b>Netlify Drop</b> (app.netlify.com/drop) or Hostinger, and upload the <b>product.html</b> file you downloaded from here.</p>'
            + '<p style="font-size:14px;line-height:1.9;margin:0 0 8px;"><b>3. 3. Connect the Domain:</b> In Netlify / Hostinger Choose <b>Add Domain / Connect Domain</b> and enter the domain you bought.</p>'
            + '<p style="font-size:14px;line-height:1.9;margin:0 0 8px;"><b>4. 4. Update DNS Settings:</b> Where you bought the domain, change the Nameservers to the ones provided by Netlify / Hostinger.</p>'
            + '<p style="font-size:14px;line-height:1.9;margin:0 0 8px;"><b>5. Wait 5 to 10 minutes</b> then try your domain in the browser - your store will work and appear to visitors.</p>'
            + '<p style="font-size:12px;line-height:1.7;color:#555;background:#fef3c7;padding:10px;border-radius:10px;margin:8px 0 0;">💡 If you do not want to buy a domain, you can use <b>Instant Link without Domain</b> below - it works instantly without a domain.</p>'
            + '<button onclick="document.getElementById(\'domain-help-modal\').style.display=\'none\'" style="width:100%;margin-top:14px;padding:12px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;">OK - Close</button>'
            + '</div>';
          m.onclick = function(e){ if(e.target===m) m.style.display="none"; };
          document.body.appendChild(m);
        };
        // نحطو الزر After Title Directly
        if(headers[i].parentElement) headers[i].parentElement.insertBefore(btn, headers[i].nextSibling);
        else headers[i].after(btn);
        break;
      }
    }
  }
  setTimeout(addDomainHelpButton, 1000);
  setTimeout(addDomainHelpButton, 2500);
</script>
